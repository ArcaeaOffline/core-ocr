[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]

name = "arcaea-offline-ocr"
authors = [{ name = "283375", email = "log_283375@163.com" }]
description = "Extract your Arcaea play result from screenshot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1,<2",
    "opencv-python>=4,<5",
]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
]


[project.urls]
"Homepage" = "https://github.com/ArcaeaOffline/core-ocr"
"Bug Tracker" = "https://github.com/ArcaeaOffline/core-ocr/issues"

[tool.setuptools_scm]

[tool.pyright]
ignore = ["**/__debug*.*", "__debug_explanation", "build", "dist"]
reportExplicitAny = false
reportAny = false
reportUnusedCallResult = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",
  "D",
  "ERA",
  "PLR",
  "COM812", # formatter compatibility
]
